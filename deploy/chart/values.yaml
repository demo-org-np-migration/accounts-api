image:
  repository: ghcr.io/demo-org-np-migration/accounts-api
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  port: 8080

# Plain env vars merged onto the container, on top of the ones the chart
# already wires (SERVICE_NAME, PORT, DATABASE_URL — see secret-ref.yaml).
env:
  ENV: staging
  LOG_LEVEL: info
  KEYCLOAK_ISSUER: http://keycloak.platform.svc:8080/realms/cauri-staging

# accounts-api reads (and writes, via freeze) the `ledger` database that
# ledger-core owns — see docs/adr/ADR-003-lectura-directa.md. postgres and
# database point at that database, not one of our own.
postgresSecret:
  # Terraform already creates `postgres-credentials` in staging and prod.
  # create:true is only for spinning up a throwaway Secret in an ad-hoc
  # namespace (kind, a demo) where Terraform hasn't run.
  create: false
  name: postgres-credentials
  host: postgres
  port: 5432
  database: ledger

serviceMonitor:
  enabled: true
  interval: 30s

podLabels: {}
podAnnotations: {}
