{{- /*
accounts-api doesn't manage the `postgres-credentials` Secret it reads —
Terraform creates it per environment (see las convenciones internas de API §2). This template
is a no-op in staging and prod (postgresSecret.create defaults to false).

postgresSecret.create: true is only for a throwaway namespace where nothing
ran Terraform (a local kind cluster, a one-off demo) and you just want the
chart to work end to end. It plants dummy credentials matching whatever
Postgres you point postgresSecret.host at — never use it against a real
`ledger`.
*/ -}}
{{- if .Values.postgresSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresSecret.name }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: cauri
  password: cauri
{{- end }}
