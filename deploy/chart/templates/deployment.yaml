apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "accounts-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "accounts-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: accounts-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: {{ include "accounts-api.name" . }}
            - name: PORT
              value: "8080"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # DATABASE_URL is built from DB_USER/DB_PASSWORD via k8s' own
            # $(VAR) env interpolation — both must come before it in this
            # list. It points at `ledger`, ledger-core's database, not
            # ours: see docs/adr/ADR-003-lectura-directa.md.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecret.name }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecret.name }}
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.postgresSecret.host }}:{{ .Values.postgresSecret.port }}/{{ .Values.postgresSecret.database }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
